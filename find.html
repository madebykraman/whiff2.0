<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Your Stage — WHIFF</title><link rel="stylesheet" href="/styles.css"></head><body><nav class="nav"><a class="logo" href="/">WHIFF</a><div class="navlinks"><a href="/collection.html">Stages</a><a href="/find.html">Find Yours</a><a href="/journal.html">Journal</a><a href="/house.html">The House</a></div><a class="cart-link" href="/cart.html">Cart <span data-cart-count>0</span></a></nav><main><section class="hero"><div class="finder"><span class="mono">The emotional fragrance finder</span><h1>FIND<br>YOUR<br>STAGE.</h1><p class="sub">Answer three small questions. Leave with the fragrance that feels most like you.</p><div class="question active" data-q="1"><p class="mono">01 / What are you craving?</p><div class="choice-grid"><button class="choice" data-answer="curious">Something unfamiliar</button><button class="choice" data-answer="drawn">Someone I cannot ignore</button><button class="choice" data-answer="obsessed">A little danger</button><button class="choice" data-answer="memory">Something I remember</button></div></div><div class="question" data-q="2"><p class="mono">02 / What should it feel like?</p><div class="choice-grid"><button class="choice" data-answer="warm">Warm and close</button><button class="choice" data-answer="dark">Dark and mysterious</button><button class="choice" data-answer="soft">Soft and intimate</button><button class="choice" data-answer="radiant">Radiant and alive</button></div></div><div class="question" data-q="3"><p class="mono">03 / Where are you going?</p><div class="choice-grid"><button class="choice" data-answer="night">Somewhere after dark</button><button class="choice" data-answer="day">An ordinary beautiful day</button><button class="choice" data-answer="alone">Nowhere. Just myself.</button><button class="choice" data-answer="together">Somewhere with someone</button></div></div><div class="result"><span class="mono">Your Stage</span><h2 id="result-name"></h2><p id="result-copy" class="sub"></p><a id="result-link" class="cta">Meet the fragrance</a></div></div></section></main><script src="/app.js"></script><script>const answers=[];document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{answers.push(b.dataset.answer);const q=b.closest('.question');q.classList.remove('active');const n=Number(q.dataset.q)+1;const next=document.querySelector('[data-q="'+n+'"]');if(next)next.classList.add('active');else{let id='02';if(answers.includes('curious'))id='01';if(answers.includes('obsessed')||answers.includes('dark'))id='03';if(answers.includes('memory'))id='08';if(answers.includes('alone')&&answers.includes('soft'))id='07';if(answers.includes('together')&&answers.includes('warm'))id='06';if(answers.includes('radiant'))id='09';const s=stage(id);document.querySelector('#result-name').textContent=s.id+' / '+s.name;document.querySelector('#result-copy').textContent=s.sense;const a=document.querySelector('#result-link');a.href='/stages/'+s.id+'.html';document.querySelector('.result').classList.add('show')}})</script></body></html>
