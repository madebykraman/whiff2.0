<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Stages — WHIFF</title><link rel="stylesheet" href="/styles.css"></head><body><nav class="nav"><a class="logo" href="/">WHIFF</a><div class="navlinks"><a href="/collection.html">Stages</a><a href="/find.html">Find Yours</a><a href="/journal.html">Journal</a><a href="/house.html">The House</a></div><a class="cart-link" href="/cart.html">Cart <span data-cart-count>0</span></a></nav><main class="wrap cart"><span class="mono">Collection 01 / Your selection</span><h1 class="section-title" style="margin-top:22px">YOUR<br>STAGES.</h1><p class="section-copy" style="margin:35px 0">Choose the feeling you want to take home.</p><div id="cart-items"></div><div style="display:flex;align-items:center;gap:12px;margin:30px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)"><input id="first-order" type="checkbox" style="width:16px;height:16px"><label for="first-order" class="mono" style="cursor:pointer">FIRST ORDER · TAKE ₹50 OFF</label></div><div class="total"><span>Total</span><span id="cart-total">₹0</span></div><p class="offer">₹299 each · all nine stages ₹2,499 · first order flat ₹50 off</p><button id="whatsapp-order" class="cta inverse">Continue on WhatsApp</button><a class="cta" href="/collection.html">Keep exploring</a></main><footer class="footer"><div class="wrap copyright mono">WHIFF · CART · COLLECTION 01</div></footer><script src="/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const box=document.querySelector('#first-order'),total=document.querySelector('#cart-total'),btn=document.querySelector('#whatsapp-order');function calc(){const c=JSON.parse(localStorage.getItem('whiff-cart')||'[]');const full=c.length===9&&c.every(x=>x.qty===1);const sub=c.reduce((a,x)=>a+299*x.qty,0);const t=Math.max(0,(full?2499:sub)-(box.checked?50:0));total.textContent='₹'+t.toLocaleString('en-IN')}box.addEventListener('change',calc);btn.onclick=()=>{const c=JSON.parse(localStorage.getItem('whiff-cart')||'[]');if(!c.length)return;const full=c.length===9&&c.every(x=>x.qty===1);const sub=c.reduce((a,x)=>a+299*x.qty,0);const t=Math.max(0,(full?2499:sub)-(box.checked?50:0));const lines=c.map(x=>x.id+' / '+stage(x.id).name+' × '+x.qty).join('\n');const msg='Hello WHIFF, I would like to order:\n\n'+lines+'\n\n'+(full?'Full Collection: ':'Total: ')+'₹'+t.toLocaleString('en-IN')+'\n'+(box.checked?'First order discount: ₹50\n':'')+'\nName:\nPhone:\nAddress:';window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')};calc()})</script></body></html>
